name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Required permission for modern dependency graph submissions
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Note: Minor patch updates to v4 automatically handle the Node 24 runtime transition
    # Ensure your runner isn't explicitly locking dependencies via old commit hashes.
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build with Maven
      run: mvn -B verify

    - name: Submit Dependency Snapshot
      uses: advanced-security/maven-dependency-submission-action@v6.0.1
